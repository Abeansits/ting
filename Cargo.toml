[package]
name = "ting"
version = "0.6.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Structured deliberation between AI models and humans, with dissent preserved"
repository = "https://github.com/Abeansits/ting"
readme = "README.md"
keywords = ["cli", "llm", "deliberation", "agents"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
rand = "0.8"
libc = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
sha2 = "0.10.9"
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
jsonschema = { version = "0.26", default-features = false }
tower = { version = "0.5", features = ["util"] }
